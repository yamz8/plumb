name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Arch, like Omarchy, so the build sees the same Qt.
    container: archlinux:latest
    steps:
      - name: Install Qt and the toolchain
        run: |
          pacman -Syu --noconfirm --needed base-devel git qt6-base qt6-declarative qt6-wayland qt6-webengine
      - uses: actions/checkout@v4
      - name: Build
        run: bin/build
      - name: Test
        run: bin/test
